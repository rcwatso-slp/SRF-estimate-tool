  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #f5f5f5; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { opacity: 1; }
    .item-card { border-left: 4px solid #C41C1C; }
    .free-ship { color: #16a34a; font-weight: 600; }
    .warn-ship  { color: #C41C1C; font-weight: 600; }
    /* PDF-only element — hidden on screen */
    #pdf-output { display: none; }
    @media print { #pdf-output { display: block; } }
    /* Number inputs */
    .num-input {
      width: 100%; border: 1px solid #d1d5db; border-radius: 6px;
      padding: 6px 10px; font-size: 14px; background: white;
    }
    .num-input:focus { outline: none; border-color: #C41C1C; box-shadow: 0 0 0 2px rgba(196,28,28,.15); }
    select.num-input { cursor: pointer; }
    .label { font-size: 12px; font-weight: 600; color: #374151; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .section-head { font-size: 11px; font-weight: 700; color: #C41C1C; text-transform: uppercase; letter-spacing: .08em; }
    .result-row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
    .result-label { color: #6b7280; }
    .result-val   { font-weight: 600; color: #1A1A1A; }
    .sell-price   { font-size: 18px; font-weight: 700; color: #C41C1C; }
    .divider      { border-top: 1px solid #e5e7eb; margin: 8px 0; }
  </style>
</head>

// ── helpers ──────────────────────────────────────────────────────────────────
let _id = 1;
const uid = () => _id++;

const fmt = (n, digits = 2) =>
  Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });

const fmtDollar = (n) => `$${fmt(n)}`;

const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
const toNumber = (value, fallback = 0) => {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
};
const moneyNum = (value) => Math.max(0, toNumber(value, 0));
const qtyNum = (value) => Math.max(0, Math.floor(toNumber(value, 0)));
const percentNum = (value, fallback = 0) => clamp(toNumber(value, fallback), 0, 100);
const marginNumFrom = (value) => clamp(toNumber(value, 50), 1, 95);
const sanitizeNumberInput = (value, { min = 0, max = Infinity, integer = false } = {}) => {
  if (value === '') return '';
  const n = Number(value);
  if (!Number.isFinite(n)) return '';
  if (n < min) return String(min);
  if (n > max) return String(max);
  return integer ? String(Math.floor(n)) : String(value);
};
const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;',
}[ch]));
const safeFilePart = (value) => String(value || '')
  .trim()
  .replace(/[^a-z0-9_\-]+/gi, '-')
  .replace(/^-+|-+$/g, '');

// helpers for size-breakdown items
function itemQty(item) {
  if (item.sizeBreakdown && item.sizeBreakdown.length > 0) {
    const t = item.sizeBreakdown.reduce((s, r) => s + (parseInt(r.qty) || 0), 0);
    return t > 0 ? t : qtyNum(item.quantity);
  }
  return qtyNum(item.quantity);
}
function itemGarmentCost(item) {
  if (item.sizeBreakdown && item.sizeBreakdown.length > 0) {
    const t = item.sizeBreakdown.reduce((s, r) => s + (parseInt(r.qty) || 0), 0);
    if (t === 0) return moneyNum(item.garmentPrice);
    const c = item.sizeBreakdown.reduce((s, r) => s + (parseFloat(r.price) || 0) * (parseInt(r.qty) || 0), 0);
    return c / t;
  }
  return moneyNum(item.garmentPrice);
}

function createItem() {
  return {
    id: uid(),
    name: '',
    quantity: 1,
    garmentPrice: '',
    decorationType: 'screen_transfer',
    decorationPrice: '',
    garmentType: 'tee',
    frontPlacements: [],
    backPlacements: [],
    sizeBreakdown: [],   // [{sizeID, sizeName, price, qty}]
  };
}

// ── per-item calculation ──────────────────────────────────────────────────────
function calcItem(item, isFreeShipping, supplierShippingTotal, totalQtyAll, multiplier) {
  const qty    = itemQty(item);
  const dPrice = moneyNum(item.decorationPrice);

  // decoration flat shipping
  const decFlat = item.decorationType === 'patch' ? 30 : 15;

  // decoration cost per unit (amortised)
  const decCostPerUnit = qty > 0
    ? item.decorationType === 'patch'
      ? (dPrice * qty + decFlat) / qty
      : (dPrice + decFlat) / qty
    : 0;

  // supplier shipping allocated to this item (total, not per-unit)
  const itemShipTotal = isFreeShipping || totalQtyAll === 0
    ? 0
    : (supplierShippingTotal * qty) / totalQtyAll;
  const shipPerUnit = qty > 0 ? itemShipTotal / qty : 0;

  // Size-breakdown path: compute per-size sell prices and accurate totals
  const hasSizes = item.sizeBreakdown && item.sizeBreakdown.length > 0
    && item.sizeBreakdown.some(r => (parseInt(r.qty) || 0) > 0);

  let gPrice, totalCost, totalSell, sellPerUnit, sizeSells = [];

  if (hasSizes) {
    const activeRows = item.sizeBreakdown.filter(r => (parseInt(r.qty) || 0) > 0);
    sizeSells = activeRows.map(r => ({
      sizeID:      r.sizeID,
      sizeName:    r.sizeName,
      price:       parseFloat(r.price) || 0,
      qty:         parseInt(r.qty) || 0,
      sellPerUnit: ((parseFloat(r.price) || 0) + decCostPerUnit + shipPerUnit) * multiplier,
    }));
    totalCost = activeRows.reduce((s, r) =>
      s + ((parseFloat(r.price) || 0) + decCostPerUnit + shipPerUnit) * (parseInt(r.qty) || 0), 0);
    totalSell   = sizeSells.reduce((s, r) => s + r.sellPerUnit * r.qty, 0);
    gPrice      = itemGarmentCost(item);
    sellPerUnit = qty > 0 ? totalSell / qty : 0;
  } else {
    gPrice = moneyNum(item.garmentPrice);
    const totalCostPerUnit = gPrice + decCostPerUnit + shipPerUnit;
    sellPerUnit = totalCostPerUnit * multiplier;
    totalCost   = totalCostPerUnit * qty;
    totalSell   = sellPerUnit * qty;
  }

  return {
    qty, gPrice, dPrice, decFlat,
    decCostPerUnit,
    shipPerUnit,
    itemShipTotal,
    totalCostPerUnit: qty > 0 ? (gPrice + decCostPerUnit + shipPerUnit) : 0,
    sellPerUnit,
    totalCost,
    totalSell,
    margin: multiplier,
    sizeSells,
  };
}

function buildGarmentSvgStr(garmentType, face, placements, width) {
  const w = width || 80;
  const paths = GARMENT_SVG_PATHS[garmentType] || GARMENT_SVG_PATHS.tee;
  const p = paths[face] || '';
  const list = Array.isArray(placements) ? placements : [];
  const dots = list.map((pl, i) => {
    const dx = (pl.x / 100 * 200).toFixed(1);
    const dy = (pl.y / 100 * 240).toFixed(1);
    const labelY = (pl.y / 100 * 240 + 4).toFixed(1);
    return '<circle cx="' + dx + '" cy="' + dy + '" r="10" fill="#C41C1C" fill-opacity="0.9"/>' +
           '<circle cx="' + dx + '" cy="' + dy + '" r="10" fill="none" stroke="#fff" stroke-width="1.5"/>' +
           '<text x="' + dx + '" y="' + labelY + '" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="Arial,sans-serif">' + (i + 1) + '</text>';
  }).join('');
  return '<svg viewBox="0 0 200 240" width="' + w + '" style="display:block;border:1px solid #e5e7eb;border-radius:4px;background:#fff">' + p + dots + '</svg>';
}

function buildPlacementRows(item) {
  const fp = item.frontPlacements || [];
  const bp = item.backPlacements  || [];
  if (!fp.length && !bp.length) return '';
  const gt = item.garmentType || 'tee';
  const cell = (face, list) => {
    if (!list.length) return '';
    const label = face.charAt(0).toUpperCase() + face.slice(1);
    const count = list.length > 1 ? ' (' + list.length + ' designs)' : '';
    return '<div style="text-align:center;display:inline-block;margin-right:14px">' +
           buildGarmentSvgStr(gt, face, list, 78) +
           '<div style="font-size:10px;color:#555;margin-top:3px;font-weight:600">' + label + count + '</div></div>';
  };
  return '<tr style="background:#fafafa;border-bottom:2px solid #e5e7eb;page-break-inside:avoid">' +
    '<td colspan="5" style="padding:6px 14px 12px">' +
    '<div style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">Design Placement</div>' +
    '<div style="display:flex;gap:0;align-items:flex-start">' + cell('front', fp) + cell('back', bp) + '</div>' +
    '</td></tr>';
}

function GarmentPlacer({ item, onChange }) {
  const [face, setFace] = useState('front');
  const svgRef = React.useRef(null);
  const garmentType = item.garmentType || 'tee';
  const paths = GARMENT_SVG_PATHS[garmentType] || GARMENT_SVG_PATHS.tee;
  const placements     = (face === 'front' ? item.frontPlacements : item.backPlacements) || [];
  const otherFace      = face === 'front' ? 'back' : 'front';
  const otherPlacements = (face === 'front' ? item.backPlacements : item.frontPlacements) || [];
  const field = face === 'front' ? 'frontPlacements' : 'backPlacements';

  const HIT_RADIUS = 14; // SVG units (~10px at 152px display width)

  const handleSvgClick = useCallback((e) => {
    const svg = svgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const xPct = Math.round(((e.clientX - rect.left) / rect.width)  * 1000) / 10;
    const yPct = Math.round(((e.clientY - rect.top)  / rect.height) * 1000) / 10;
    const svgX = xPct / 100 * 200;
    const svgY = yPct / 100 * 240;
    // Check if click is near an existing marker → remove it
    const current = (face === 'front' ? item.frontPlacements : item.backPlacements) || [];
    const hitIdx = current.findIndex(p => {
      const px = p.x / 100 * 200;
      const py = p.y / 100 * 240;
      return Math.sqrt((px - svgX) ** 2 + (py - svgY) ** 2) < HIT_RADIUS;
    });
    if (hitIdx !== -1) {
      onChange(item.id, face === 'front' ? 'frontPlacements' : 'backPlacements',
               current.filter((_, i) => i !== hitIdx));
    } else {
      onChange(item.id, face === 'front' ? 'frontPlacements' : 'backPlacements',
               [...current, { x: xPct, y: yPct }]);
    }
  }, [face, item.id, item.frontPlacements, item.backPlacements, onChange]);

  const clearAll = () => onChange(item.id, field, []);

  // Build SVG dot markup for current face
  const dots = placements.map((pl, i) => {
    const dx = (pl.x / 100 * 200).toFixed(1);
    const dy = (pl.y / 100 * 240).toFixed(1);
    const ly = (pl.y / 100 * 240 + 4).toFixed(1);
    return '<circle cx="' + dx + '" cy="' + dy + '" r="10" fill="#C41C1C" fill-opacity="0.9"/>' +
           '<circle cx="' + dx + '" cy="' + dy + '" r="10" fill="none" stroke="#fff" stroke-width="1.5"/>' +
           '<text x="' + dx + '" y="' + ly + '" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="Arial,sans-serif">' + (i + 1) + '</text>';
  }).join('');

  return (
    <div className="mt-4 pt-4 border-t border-gray-100">
      <div className="flex flex-wrap items-center gap-3 mb-3">
        <span className="text-xs font-bold text-gray-500 uppercase tracking-widest">Design Placement</span>
        <select
          className="num-input"
          style={{ maxWidth: 160, fontSize: 13, padding: '4px 8px' }}
          value={garmentType}
          onChange={e => onChange(item.id, 'garmentType', e.target.value)}>
          {GARMENT_TYPES.map(g => <option key={g.value} value={g.value}>{g.label}</option>)}
        </select>
      </div>

      <div className="flex gap-4 items-start">
        <div style={{ flexShrink: 0 }}>
          <div className="flex gap-1 mb-2">
            {['front', 'back'].map(f => {
              const cnt = ((f === 'front' ? item.frontPlacements : item.backPlacements) || []).length;
              const active = face === f;
              return (
                <button key={f} onClick={() => setFace(f)}
                  style={{
                    padding: '3px 12px', borderRadius: 6, fontSize: 12, fontWeight: 600,
                    border: '1px solid',
                    borderColor: active ? '#C41C1C' : '#d1d5db',
                    background: active ? '#C41C1C' : '#fff',
                    color: active ? '#fff' : '#374151',
                    cursor: 'pointer',
                  }}>
                  {f.charAt(0).toUpperCase() + f.slice(1)}{cnt > 0 ? ' (' + cnt + ')' : ''}
                </button>
              );
            })}
          </div>
          <svg
            ref={svgRef}
            viewBox="0 0 200 240"
            width="152"
            onClick={handleSvgClick}
            style={{ display: 'block', border: '1px solid #e5e7eb', borderRadius: 8, background: '#fff', cursor: 'crosshair' }}
            dangerouslySetInnerHTML={{ __html: paths[face] + dots }}
          />
        </div>
        <div className="flex-1 pt-1 text-sm">
          <div className="font-semibold text-gray-700 mb-1">
            {face.charAt(0).toUpperCase() + face.slice(1)} Design
          </div>
          {placements.length > 0
            ? <div className="text-green-600 text-xs font-medium">
                {placements.length} location{placements.length > 1 ? 's' : ''} marked
              </div>
            : <div className="text-gray-400 text-xs">Click garment to add design locations</div>
          }
          <div className="text-gray-300 text-xs mt-1">Click marker to remove it</div>
          {placements.length > 0 && (
            <button onClick={clearAll}
              style={{ marginTop: 6, fontSize: 11, color: '#C41C1C', background: 'none', border: 'none', cursor: 'pointer', padding: 0, textDecoration: 'underline' }}>
              Clear all
            </button>
          )}
          {placements.length === 0 && otherPlacements.length > 0 && (
            <div className="text-xs text-gray-400 mt-2">
              {otherFace.charAt(0).toUpperCase() + otherFace.slice(1)} has {otherPlacements.length} location{otherPlacements.length > 1 ? 's' : ''}
            </div>
          )}
          <div className="text-xs text-gray-300 mt-3 leading-snug">
            Front &amp; back each supported
          </div>
        </div>
      </div>
    </div>
  );
}

function inferGarmentType(title) {
  const t = (title || '').toLowerCase();
  if (t.includes('zip') && (t.includes('hoodie') || t.includes('fleece'))) return 'zip_hoodie';
  if (t.includes('hoodie') || t.includes('pullover') || t.includes('sweatshirt') || t.includes('fleece')) return 'hoodie';
  if (t.includes('long sleeve') || t.includes('long-sleeve') || t.includes('longsleeve')) return 'longsleeve';
  if (t.includes('tank') || t.includes('sleeveless') || t.includes('muscle')) return 'tank';
  if (t.includes('polo')) return 'polo';
  return 'tee';
}

function groupByColor(products) {
  const map = {};
  (products || []).forEach(p => {
    const key = p.colorName || p.colorID || 'Unknown';
    if (!map[key]) map[key] = { colorName: key, prices: [], totalQty: 0, image: p.colorFrontImage || p.styleImage || null };
    map[key].prices.push({ sizeID: p.sizeID, sizeName: p.sizeName || p.sizeID, price: p.piecePrice || p.price || 0, qty: p.qty || 0 });
    map[key].totalQty += (p.qty || 0);
  });
  return Object.values(map).sort((a, b) => a.colorName.localeCompare(b.colorName));
}

function SSSearchModal({ onClose, onSelect, initialStyle, initialProducts }) {
  const [query, setQuery]             = React.useState('');
  const [styleList, setStyleList]     = React.useState([]);
  const [loading, setLoading]         = React.useState(false);
  const [error, setError]             = React.useState('');
  const [selStyle, setSelStyle]       = React.useState(initialStyle || null);
  const [products, setProducts]       = React.useState(initialProducts || []);
  const [loadingProds, setLoadingProds] = React.useState(false);
  const timerRef = React.useRef(null);
  const inputRef = React.useRef(null);

  React.useEffect(() => { if (inputRef.current && !initialStyle) inputRef.current.focus(); }, []);
  React.useEffect(() => {
    const h = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [onClose]);
  // Auto-load colors when modal opens with a pre-selected style but no products yet
  React.useEffect(() => {
    if (initialStyle && (!initialProducts || initialProducts.length === 0)) {
      loadColors(initialStyle);
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const loadColors = async (style) => {
    setSelStyle(style); setProducts([]); setLoadingProds(true); setError('');
    try {
      const r = await fetch(`/api/ss?path=products&styleid=${encodeURIComponent(style.styleID)}`);
      const data = await r.json();
      setProducts(r.ok && Array.isArray(data) ? data : []);
    } catch(e) { setError(e.message); }
    setLoadingProds(false);
  };

  const doSearch = async (q) => {
    const t = q.trim();
    if (!t || t.length < 2) { setStyleList([]); return; }
    setLoading(true); setError('');
    try {
      const r = await fetch(`/api/ss?path=search&q=${encodeURIComponent(t)}`);
      const data = await r.json();
      if (data.error) throw new Error(data.error);
      if (data.type === 'direct') {
        // Skip style list — go straight to colors
        setSelStyle(data.styleInfo);
        setProducts(data.products || []);
        setStyleList([]);
      } else if (data.type === 'styles' && data.results?.length) {
        setStyleList(data.results);
      } else {
        setStyleList([]);
        setError('No results. Try a style number (e.g. 3001CVC, G500) or brand name (e.g. Bella, Gildan).');
      }
    } catch(e) { setError(e.message); }
    setLoading(false);
  };

  const colorGroups = React.useMemo(() => groupByColor(products), [products]);

  const handleColorSelect = (cg) => {
    const sorted = cg.prices.sort((a, b) => a.price - b.price);
    const basePrice = sorted[0]?.price || 0;
    const label = `${selStyle.brandName || ''} ${selStyle.title || selStyle.styleID} – ${cg.colorName}`.trim();
    const garmentType = inferGarmentType((selStyle.title || '') + ' ' + (selStyle.categoryName || ''));
    onSelect({ name: label, garmentPrice: basePrice.toFixed(2), garmentType, label, prices: cg.prices });
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', zIndex: 2000, display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: '40px 16px', overflowY: 'auto' }}
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: '#fff', borderRadius: 12, width: '100%', maxWidth: 640, minHeight: 300, boxShadow: '0 8px 40px rgba(0,0,0,0.2)', display: 'flex', flexDirection: 'column' }}>

        {/* Header */}
        <div style={{ padding: '16px 20px', borderBottom: '1px solid #e5e7eb', display: 'flex', alignItems: 'center', gap: 10 }}>
          {selStyle && <button onClick={() => { setSelStyle(null); setProducts([]); }} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#6b7280', fontSize: 18, padding: '0 4px' }}>←</button>}
          <div style={{ fontWeight: 800, fontSize: 15, flex: 1 }}>
            {selStyle ? `${selStyle.brandName || ''} ${selStyle.title || selStyle.styleID} — Pick a Color` : 'Search S&S Activewear'}
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#9ca3af', fontSize: 22 }}>×</button>
        </div>

        {/* Search input — only shown when browsing style list */}
        {!selStyle && (
          <div style={{ padding: '12px 20px', borderBottom: '1px solid #f0f0f0' }}>
            <input ref={inputRef} type="text" value={query}
              onChange={e => { const v = e.target.value; setQuery(v); clearTimeout(timerRef.current); timerRef.current = setTimeout(() => doSearch(v), 420); }}
              placeholder="Style # (3001CVC, G500, PC61) or brand name (Bella, Gildan…)"
              style={{ width: '100%', padding: '9px 12px', border: '1.5px solid #d1d5db', borderRadius: 7, fontSize: 14, boxSizing: 'border-box', outline: 'none' }} />
          </div>
        )}

        {/* Body */}
        <div style={{ flex: 1, overflowY: 'auto' }}>
          {error && <div style={{ padding: '10px 20px', color: '#ef4444', fontSize: 13, background: '#fef2f2' }}>{error}</div>}

          {/* Style list */}
          {!selStyle && <>
            {loading && <div style={{ padding: 24, textAlign: 'center', color: '#6b7280' }}>Searching…</div>}
            {!loading && !query && <div style={{ padding: 24, textAlign: 'center', color: '#9ca3af', fontSize: 13 }}>Type a style number or brand above to search.</div>}
            {!loading && styleList.map(s => (
              <div key={s.styleID} onClick={() => loadColors(s)}
                style={{ padding: '11px 20px', borderBottom: '1px solid #f5f5f5', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 12 }}
                onMouseOver={e => e.currentTarget.style.background = '#f9fafb'}
                onMouseOut={e => e.currentTarget.style.background = '#fff'}>
                {s.styleImage && <img src={s.styleImage} style={{ width: 44, height: 44, objectFit: 'contain', borderRadius: 4, border: '1px solid #e5e7eb', flexShrink: 0 }} alt="" onError={e => e.target.style.display='none'} />}
                <div>
                  <div style={{ fontWeight: 700, fontSize: 13 }}>{s.brandName} {s.title || s.styleID}</div>
                  <div style={{ fontSize: 11, color: '#6b7280', marginTop: 2 }}>{s.styleID}{s.categoryName ? ` · ${s.categoryName}` : ''}</div>
                </div>
                <div style={{ marginLeft: 'auto', color: '#C41C1C', fontSize: 18 }}>›</div>
              </div>
            ))}
          </>}

          {/* Color list */}
          {selStyle && <>
            {loadingProds && <div style={{ padding: 24, textAlign: 'center', color: '#6b7280' }}>Loading colors &amp; pricing…</div>}
            {!loadingProds && colorGroups.length === 0 && <div style={{ padding: 24, textAlign: 'center', color: '#9ca3af' }}>No inventory data available.</div>}
            {!loadingProds && colorGroups.map(cg => {
              const sorted = cg.prices.sort((a, b) => a.price - b.price);
              const base = sorted[0]?.price || 0, max = sorted[sorted.length-1]?.price || 0;
              const inStock = cg.totalQty > 0;
              return (
                <div key={cg.colorName} onClick={() => inStock && handleColorSelect(cg)}
                  style={{ padding: '10px 20px', borderBottom: '1px solid #f5f5f5', cursor: inStock ? 'pointer' : 'default', opacity: inStock ? 1 : 0.45, display: 'flex', alignItems: 'center', gap: 12 }}
                  onMouseOver={e => { if (inStock) e.currentTarget.style.background = '#f9fafb'; }}
                  onMouseOut={e => e.currentTarget.style.background = '#fff'}>
                  {cg.image && <img src={cg.image} style={{ width: 44, height: 44, objectFit: 'contain', borderRadius: 4, border: '1px solid #e5e7eb', flexShrink: 0 }} alt="" onError={e => e.target.style.display='none'} />}
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, fontSize: 13 }}>{cg.colorName}</div>
                    <div style={{ fontSize: 11, color: '#6b7280', marginTop: 2 }}>
                      {sorted.map(p => `${p.sizeName}: $${p.price.toFixed(2)}`).join(' · ')}
                    </div>
                  </div>
                  <div style={{ textAlign: 'right', flexShrink: 0 }}>
                    <div style={{ fontWeight: 800, fontSize: 14, color: '#C41C1C' }}>${base.toFixed(2)}{max > base ? `–$${max.toFixed(2)}` : ''}</div>
                    <div style={{ fontSize: 10, fontWeight: 600, color: inStock ? '#16a34a' : '#ef4444' }}>{inStock ? `${cg.totalQty.toLocaleString()} in stock` : 'Out of stock'}</div>
                  </div>
                </div>
              );
            })}
          </>}
        </div>
      </div>
    </div>
  );
}

function ItemCard({ item, index, calc, isFreeShipping, onChange, onRemove, canRemove }) {
  const [ssOpen, setSsOpen]           = React.useState(false);
  const [ssInitStyle, setSsInitStyle] = React.useState(null);
  const [ssInitProds, setSsInitProds] = React.useState(null);
  const [suggestions, setSuggestions] = React.useState([]);
  const [ssSearching, setSSSearching] = React.useState(false);
  const [ssSearchError, setSSSearchError] = React.useState('');
  const timerRef = React.useRef(null);

  const set = (field) => (e) => onChange(item.id, field, e.target.value);
  const setNumber = (field, options) => (e) => onChange(item.id, field, sanitizeNumberInput(e.target.value, options));

  const handleSSSelect = ({ name, garmentPrice, garmentType, label, prices }) => {
    onChange(item.id, 'name', name);
    onChange(item.id, 'garmentType', garmentType || item.garmentType);
    onChange(item.id, '_ssLabel', label || name);
    if (prices && prices.length > 0) {
      // Build size breakdown table with qty=0 for each size, sorted cheapest first
      const sorted = [...prices].sort((a, b) => a.price - b.price);
      const breakdown = sorted.map(p => ({
        sizeID:   p.sizeID   || p.sizeName,
        sizeName: p.sizeName || p.sizeID,
        price:    p.price    || 0,
        qty:      0,
      }));
      onChange(item.id, 'sizeBreakdown', breakdown);
      onChange(item.id, 'garmentPrice', (sorted[0]?.price || 0).toFixed(2));
    } else {
      onChange(item.id, 'garmentPrice', garmentPrice);
      onChange(item.id, 'sizeBreakdown', []);
    }
    setSsOpen(false); setSsInitStyle(null); setSsInitProds(null);
  };

  const handleNameInput = (e) => {
    const val = e.target.value;
    onChange(item.id, 'name', val);
    clearTimeout(timerRef.current);
    setSSSearchError('');
    if (val.trim().length < 2) { setSuggestions([]); return; }
    timerRef.current = setTimeout(async () => {
      setSSSearching(true);
      try {
        const r = await fetch(`/api/ss?path=search&q=${encodeURIComponent(val.trim())}`);
        if (!r.ok) {
          setSSSearchError(`S&S API error (${r.status}) — use Browse S&S`);
          setSuggestions([]); setSSSearching(false); return;
        }
        const data = await r.json();
        if (data.error) {
          setSSSearchError(data.error);
          setSuggestions([]); setSSSearching(false); return;
        }
        if (data.type === 'direct') {
          setSuggestions([]); setSSSearchError('');
          setSsInitStyle(data.styleInfo);
          setSsInitProds(data.products || []);
          setSsOpen(true);
        } else if (data.type === 'styles' && data.results?.length) {
          setSuggestions(data.results.slice(0, 8));
          setSSSearchError('');
        } else {
          setSuggestions([]);
          setSSSearchError('No results — try a style # (e.g. 3001CVC, PC61) or click Browse S&S');
        }
      } catch(err) {
        setSuggestions([]);
        setSSSearchError('Search unavailable — click Browse S&S to find products');
      }
      setSSSearching(false);
    }, 480);
  };

  const pickSuggestion = (style) => {
    setSuggestions([]);
    setSsInitStyle(style);
    setSsInitProds(null);
    setSsOpen(true);
  };

  const decLabel = {
    screen_transfer: 'Screen Printed Transfer',
    ucm:             'Ultra Color Max (UCM)',
    patch:           'Heat-Applied Patch (Stahls)',
  };

  return (
    <div className="item-card bg-white rounded-xl shadow-sm p-5 mb-4">
      {ssOpen && <SSSearchModal onClose={() => { setSsOpen(false); setSsInitStyle(null); setSsInitProds(null); }} onSelect={handleSSSelect} initialStyle={ssInitStyle} initialProducts={ssInitProds} />}
      {/* row 1 — item header */}
      <div className="flex items-center justify-between mb-4">
        <div className="flex items-center gap-3 flex-1">
          <span className="bg-brand-red text-white text-xs font-bold px-2 py-1 rounded">
            ITEM {index + 1}
          </span>
          <div style={{ position: 'relative', flex: 1, maxWidth: 340 }}>
            <input
              className="num-input"
              style={{ width: '100%', paddingRight: ssSearching ? 80 : 12 }}
              placeholder="Type garment name to search S&S catalog…"
              value={item.name}
              onChange={handleNameInput}
              onBlur={() => setTimeout(() => setSuggestions([]), 200)}
              autoComplete="off"
            />
            {ssSearching && <span style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)', fontSize: 11, color: '#9ca3af', pointerEvents: 'none' }}>Searching…</span>}
            {suggestions.length > 0 && (
              <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: '#fff', border: '1px solid #e5e7eb', borderRadius: 7, boxShadow: '0 6px 18px rgba(0,0,0,0.12)', zIndex: 300, maxHeight: 220, overflowY: 'auto' }}>
                {suggestions.map(s => (
                  <div key={s.styleID} onMouseDown={() => pickSuggestion(s)}
                    style={{ padding: '9px 13px', cursor: 'pointer', borderBottom: '1px solid #f5f5f5', display: 'flex', alignItems: 'center', gap: 10 }}
                    onMouseOver={e => e.currentTarget.style.background = '#f9fafb'}
                    onMouseOut={e => e.currentTarget.style.background = '#fff'}>
                    {s.styleImage && <img src={s.styleImage} style={{ width: 34, height: 34, objectFit: 'contain', borderRadius: 3, border: '1px solid #e5e7eb', flexShrink: 0 }} alt="" onError={e => e.target.style.display='none'} />}
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 13, color: '#1A1A1A' }}>{s.brandName} {s.title || s.styleID}</div>
                      <div style={{ fontSize: 11, color: '#9ca3af' }}>{s.styleID}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {ssSearchError && !suggestions.length && !ssSearching && (
              <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, background: '#fff8f8', border: '1px solid #fca5a5', borderRadius: 7, padding: '8px 13px', fontSize: 11, color: '#b91c1c', zIndex: 300 }}>
                {ssSearchError}
              </div>
            )}
          </div>
          <button type="button" onClick={() => { setSsInitStyle(null); setSsInitProds(null); setSsOpen(true); }}
            style={{ fontSize: 11, fontWeight: 700, color: '#C41C1C', background: '#fff0f0', border: '1px solid #C41C1C', borderRadius: 5, padding: '4px 9px', cursor: 'pointer', whiteSpace: 'nowrap', flexShrink: 0 }}>
            Browse S&amp;S
          </button>
        </div>
        {canRemove && (
          <button
            onClick={() => onRemove(item.id)}
            className="ml-3 text-gray-400 hover:text-red-600 text-xl font-bold leading-none"
            title="Remove item"
          >×</button>
        )}
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
        {/* qty */}
        <div>
          <div className="label">Quantity</div>
          {item.sizeBreakdown && item.sizeBreakdown.some(r => (parseInt(r.qty) || 0) > 0)
            ? <div className="num-input" style={{ background: '#f9fafb', display: 'flex', alignItems: 'center', justifyContent: 'space-between', cursor: 'default' }}>
                <span style={{ fontWeight: 700 }}>{itemQty(item)}</span>
                <span style={{ fontSize: 10, color: '#9ca3af' }}>from sizes ↓</span>
              </div>
            : <input type="number" min="1" className="num-input"
                value={item.quantity} onChange={setNumber('quantity', { min: 1, integer: true })} />
          }
        </div>

        {/* garment price */}
        <div>
          <div className="label">Garment Price / Unit ($)</div>
          {item.sizeBreakdown && item.sizeBreakdown.length > 0
            ? <div className="num-input" style={{ background: '#f9fafb', cursor: 'default' }}>
                <span style={{ fontWeight: 700 }}>${itemGarmentCost(item).toFixed(2)}</span>
                <span style={{ fontSize: 10, color: '#9ca3af', marginLeft: 6 }}>
                  {item.sizeBreakdown.some(r => (parseInt(r.qty) || 0) > 0) ? 'weighted avg' : 'base price'}
                </span>
              </div>
            : <input type="number" min="0" step="0.01" className="num-input"
                placeholder="0.00" value={item.garmentPrice} onChange={setNumber('garmentPrice', { min: 0 })} />
          }
          <div className="text-xs mt-1" style={{ color: item._ssLabel ? '#16a34a' : '#9ca3af' }}>
            {item._ssLabel ? `✓ ${item._ssLabel}` : 'Auto-filled when you pick from S&S'}
          </div>
        </div>

        {/* decoration type */}
        <div>
          <div className="label">Decoration Type</div>
          <select className="num-input" value={item.decorationType} onChange={set('decorationType')}>
            <option value="screen_transfer">Screen Printed Transfer (Transfer Express)</option>
            <option value="ucm">Ultra Color Max / UCM (Transfer Express)</option>
            <option value="patch">Heat-Applied Patch (Stahls)</option>
          </select>
        </div>

        {/* decoration price */}
        <div>
          <div className="label">
            {item.decorationType === 'patch' ? 'Price / Patch ($)' : 'Total Transfer Price ($)'}
          </div>
          <input type="number" min="0" step="0.01" className="num-input"
            placeholder="0.00" value={item.decorationPrice} onChange={setNumber('decorationPrice', { min: 0 })} />
          <div className="text-xs text-gray-400 mt-1">
            {item.decorationType === 'patch'
              ? <span>Look up at <span className="text-blue-500">stahlsusa.com</span> · +$30 flat ship</span>
              : <span>Enter total for all {itemQty(item)} transfers · +$15 flat ship added automatically</span>
            }
          </div>
        </div>
      </div>

      {/* size breakdown table */}
      {item.sizeBreakdown && item.sizeBreakdown.length > 0 && (
        <SizeBreakdown breakdown={item.sizeBreakdown} itemId={item.id} onChange={onChange} />
      )}

      {/* results */}
      {(itemGarmentCost(item) > 0 || moneyNum(item.decorationPrice) > 0) && (
        <div className="mt-4 pt-4 border-t border-gray-100">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <ResultBox label="Garment Cost / Unit" val={fmtDollar(calc.gPrice)} />
            <ResultBox label="Decoration Cost / Unit" val={fmtDollar(calc.decCostPerUnit)} sub={`incl. $${calc.decFlat} ship`} />
            <ResultBox label="Shipping / Unit" val={isFreeShipping ? '$0.00' : fmtDollar(calc.shipPerUnit)} sub={isFreeShipping ? 'Free' : ''} />
            <ResultBox label="Sell Price / Unit" val={fmtDollar(calc.sellPerUnit)} highlight />
          </div>

          {/* Internal cost & profit box — hidden from PDF */}
          <div className="mt-3 rounded-lg p-3 border border-dashed border-gray-300 bg-gray-50">
            <div className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Internal — not on invoice</div>
            <div className="grid grid-cols-3 gap-3 text-sm">
              <div>
                <div className="text-xs text-gray-500 mb-0.5">Our Cost</div>
                <div className="font-bold text-gray-700">{fmtDollar(calc.totalCost)}</div>
              </div>
              <div>
                <div className="text-xs text-gray-500 mb-0.5">Revenue</div>
                <div className="font-bold text-brand-red">{fmtDollar(calc.totalSell)}</div>
              </div>
              <div>
                <div className="text-xs text-gray-500 mb-0.5">Profit</div>
                <div className="font-bold text-green-600">{fmtDollar(calc.totalSell - calc.totalCost)}</div>
              </div>
            </div>
          </div>
        </div>
      )}
      <GarmentPlacer item={item} onChange={onChange} />
    </div>
  );
}

function ResultBox({ label, val, sub, highlight }) {
  return (
    <div className={`rounded-lg p-3 ${highlight ? 'bg-brand-red text-white' : 'bg-gray-50'}`}>
      <div className={`text-xs font-semibold uppercase tracking-wide mb-1 ${highlight ? 'text-red-100' : 'text-gray-500'}`}>
        {label}
      </div>
      <div className={`text-lg font-bold ${highlight ? 'text-white' : 'text-brand-black'}`}>
        {val}
      </div>
      {sub && <div className={`text-xs ${highlight ? 'text-red-100' : 'text-green-600'}`}>{sub}</div>}
    </div>
  );
}

// ── Size Breakdown table ───────────────────────────────────────────────────────
function SizeBreakdown({ breakdown, itemId, onChange }) {
  if (!breakdown || breakdown.length === 0) return null;
  const total = breakdown.reduce((s, r) => s + (parseInt(r.qty) || 0), 0);
  const cost  = breakdown.reduce((s, r) => s + (parseFloat(r.price) || 0) * (parseInt(r.qty) || 0), 0);
  return (
    <div style={{ marginTop: 14, padding: '10px 14px', background: '#f8fafc', borderRadius: 8, border: '1px solid #e2e8f0' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: '#64748b', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
          Size Breakdown — enter qty per size
        </div>
        <button onClick={() => onChange(itemId, 'sizeBreakdown', [])}
          style={{ fontSize: 11, color: '#9ca3af', background: 'none', border: 'none', cursor: 'pointer', padding: '2px 6px' }}>
          ✕ Clear sizes
        </button>
      </div>
      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
        <thead>
          <tr style={{ borderBottom: '1.5px solid #e2e8f0' }}>
            <th style={{ textAlign: 'left',   padding: '3px 8px', color: '#64748b', fontWeight: 600, fontSize: 11 }}>Size</th>
            <th style={{ textAlign: 'right',  padding: '3px 8px', color: '#64748b', fontWeight: 600, fontSize: 11 }}>S&amp;S Price</th>
            <th style={{ textAlign: 'center', padding: '3px 8px', color: '#64748b', fontWeight: 600, fontSize: 11 }}>Qty</th>
            <th style={{ textAlign: 'right',  padding: '3px 8px', color: '#64748b', fontWeight: 600, fontSize: 11 }}>Subtotal</th>
          </tr>
        </thead>
        <tbody>
          {breakdown.map((row, i) => {
            const sub = (parseFloat(row.price) || 0) * (parseInt(row.qty) || 0);
            return (
              <tr key={row.sizeID || i} style={{ borderBottom: '1px solid #f1f5f9' }}>
                <td style={{ padding: '4px 8px', fontWeight: 600, color: '#374151' }}>{row.sizeName}</td>
                <td style={{ padding: '4px 8px', textAlign: 'right', color: '#374151' }}>
                  ${(parseFloat(row.price) || 0).toFixed(2)}
                </td>
                <td style={{ padding: '4px 8px', textAlign: 'center' }}>
                  <input type="number" min="0" value={row.qty}
                    onChange={e => {
                      const nb = breakdown.map((r, j) => j === i ? { ...r, qty: e.target.value } : r);
                      onChange(itemId, 'sizeBreakdown', nb);
                    }}
                    style={{ width: 60, padding: '3px 6px', border: '1px solid #d1d5db', borderRadius: 4, textAlign: 'center', fontSize: 12 }} />
                </td>
                <td style={{ padding: '4px 8px', textAlign: 'right', color: sub > 0 ? '#374151' : '#cbd5e1' }}>
                  {sub > 0 ? `$${sub.toFixed(2)}` : '—'}
                </td>
              </tr>
            );
          })}
        </tbody>
        <tfoot>
          <tr style={{ borderTop: '2px solid #e2e8f0', background: '#f1f5f9' }}>
            <td colSpan={2} style={{ padding: '5px 8px', fontWeight: 700, fontSize: 12, color: '#374151' }}>
              Total garment cost
            </td>
            <td style={{ padding: '5px 8px', textAlign: 'center', fontWeight: 800, color: '#1A1A1A' }}>{total}</td>
            <td style={{ padding: '5px 8px', textAlign: 'right', fontWeight: 800, color: '#C41C1C' }}>
              {cost > 0 ? `$${cost.toFixed(2)}` : '—'}
            </td>
          </tr>
        </tfoot>
      </table>
    </div>
  );
}

// ── PDF Generator ─────────────────────────────────────────────────────────────
function buildPdfHtml(items, calcs, totals, clientName, estimateNumber, estimateDate, notes, discountAmount, discountedTotal, discountType, discountValue) {
  const decLabels = { screen_transfer: 'Screen Printed Transfer', ucm: 'UCM Transfer', patch: 'Heat-Applied Patch' };
  const safeClientName = escapeHtml(clientName);
  const safeEstimateNumber = escapeHtml(estimateNumber);
  const safeEstimateDate = escapeHtml(estimateDate);
  const safeNotes = escapeHtml(notes).replace(/\n/g, '<br>');
  const safeDiscountValue = fmt(percentNum(discountValue), 0);

  const rows = items.map((item, i) => {
    const c = calcs[i];
    const qty = c.qty;
    const name = escapeHtml(item.name || `Item ${i + 1}`);
    const decLabel = escapeHtml(decLabels[item.decorationType] || 'Decoration');
    const decSellUnit  = c.decCostPerUnit * c.margin;
    const shipSellUnit = c.shipPerUnit * c.margin;

    const subRow = (label, detail, sellUnit, rowQty) => {
      const q = rowQty !== undefined ? rowQty : qty;
      return `
      <tr style="background:#fafafa;border-bottom:1px solid #f0f0f0;page-break-inside:avoid">
        <td style="padding:4px 10px 4px 22px;font-size:11px;color:#555;word-break:break-word">${escapeHtml(label)}</td>
        <td style="padding:4px 10px;font-size:11px;color:#777;word-break:break-word">${detail}</td>
        <td style="padding:4px 8px;text-align:center;font-size:11px;color:#555">${q}</td>
        <td style="padding:4px 8px;text-align:right;font-size:11px;color:#555;white-space:nowrap">$${fmt(sellUnit)}</td>
        <td style="padding:4px 10px;text-align:right;font-size:11px;color:#555;white-space:nowrap">$${fmt(sellUnit * q)}</td>
      </tr>`;
    };

    // Build garment rows — group sizes by price tier
    let garmentRows;
    if (c.sizeSells && c.sizeSells.length > 0) {
      const tiers = {};
      c.sizeSells.forEach(s => {
        const key = s.price.toFixed(2);
        if (!tiers[key]) tiers[key] = { sizes: [], qty: 0, sellPerUnit: s.sellPerUnit };
        tiers[key].sizes.push(s.sizeName);
        tiers[key].qty += s.qty;
      });
      garmentRows = Object.values(tiers).map(tier =>
        subRow(`Garments (${tier.sizes.join(', ')})`, 'S&amp;S Activewear', tier.sellPerUnit, tier.qty)
      ).join('');
    } else {
      garmentRows = subRow('Garments', 'S&amp;S Activewear', c.gPrice * c.margin);
    }

    return `
      <tr style="background:#fff;border-top:2px solid #e5e7eb;page-break-inside:avoid">
        <td colspan="2" style="padding:10px 10px 5px;font-weight:800;font-size:13px;color:#1A1A1A;word-break:break-word;line-height:1.3">${name}</td>
        <td style="padding:10px 8px 5px;text-align:center;font-size:12px;color:#555">${qty}</td>
        <td style="padding:10px 8px 5px;text-align:right;font-size:12px;font-weight:700;color:#555;white-space:nowrap">$${fmt(c.sellPerUnit)}</td>
        <td style="padding:10px 10px 5px;text-align:right;font-weight:800;font-size:14px;color:#C41C1C;white-space:nowrap">$${fmt(c.totalSell)}</td>
      </tr>
      ${garmentRows}
      ${subRow('Decoration', decLabel, decSellUnit)}
      ${shipSellUnit > 0.001 ? subRow('Shipping', 'S&amp;S Activewear', shipSellUnit) : ''}
      ${buildPlacementRows(item)}`;
  }).join('');

  const hasDiscount = discountAmount > 0;
  const discountLabel = discountType === 'percent'
    ? `Discount (${safeDiscountValue}% off)`
    : 'Discount';

  return `
  <div style="font-family:Arial,Helvetica,sans-serif;max-width:760px;margin:0 auto;padding:0;color:#1A1A1A;background:#fff">

    <!-- Header — table layout (html2canvas requires tables, not flex) -->
    <table style="width:100%;border-collapse:collapse;background:#1A1A1A;border-radius:8px 8px 0 0">
      <tr>
        <td style="padding:20px 28px;vertical-align:middle;width:55%">
          <table style="border-collapse:collapse"><tr>
            <td style="background:#fff;border-radius:6px;padding:6px 10px;vertical-align:middle">
              <img src="data:image/png;base64,${LOGO_B64}" style="height:54px;max-width:170px;display:block" alt="SRF Logo" />
            </td>
          </tr></table>
        </td>
        <td style="padding:20px 28px;vertical-align:middle;text-align:right;width:45%">
          <div style="color:#C41C1C;font-size:27px;font-weight:800">ESTIMATE</div>
          ${estimateNumber ? `<div style="color:#aaa;font-size:12px;word-break:break-word">No. ${safeEstimateNumber}</div>` : ''}
          <div style="color:#aaa;font-size:12px">${safeEstimateDate}</div>
        </td>
      </tr>
    </table>

    <!-- Client info bar -->
    <div style="background:#C41C1C;padding:10px 28px">
      <span style="color:#fff;font-size:14px;font-weight:700;line-height:1.4;word-break:break-word">
        ${clientName ? `Prepared for: ${safeClientName}` : 'Prepared by: SRF Screen Printing &amp; Apparel'}
      </span>
    </div>

    <!-- Items table -->
    <div style="background:#fff;padding:0 0 8px">
      <table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed">
        <colgroup>
          <col style="width:34%" />
          <col style="width:25%" />
          <col style="width:10%" />
          <col style="width:14%" />
          <col style="width:17%" />
        </colgroup>
        <thead>
          <tr style="background:#1A1A1A;color:#fff">
            <th style="padding:9px 10px;text-align:left;font-weight:700;font-size:12px">Item / Component</th>
            <th style="padding:9px 10px;text-align:left;font-weight:700;font-size:12px">Detail</th>
            <th style="padding:9px 8px;text-align:center;font-weight:700;font-size:12px">Qty</th>
            <th style="padding:9px 8px;text-align:right;font-weight:700;font-size:12px">Unit</th>
            <th style="padding:9px 10px;text-align:right;font-weight:700;font-size:12px">Total</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <!-- Totals — table layout -->
    <div style="background:#f9f9f9;padding:16px 28px;border-top:2px solid #C41C1C">
      <table style="width:100%;border-collapse:collapse">
        <tr>
          <td style="width:52%"></td>
          <td style="width:48%;vertical-align:top">
            <table style="width:100%;border-collapse:collapse">
              <tr style="border-bottom:1px solid #e5e7eb">
                <td style="padding:5px 0;font-size:14px;color:#555">Subtotal</td>
                <td style="padding:5px 0;font-size:14px;font-weight:600;text-align:right">$${fmt(totals.totalSell)}</td>
              </tr>
              ${hasDiscount ? `
              <tr style="border-bottom:1px solid #e5e7eb">
                <td style="padding:5px 0;font-size:14px;color:#16a34a">${discountLabel}</td>
                <td style="padding:5px 0;font-size:14px;font-weight:600;text-align:right;color:#16a34a">-$${fmt(discountAmount)}</td>

              <tr>
                <td style="padding:8px 0 4px;font-weight:700;font-size:15px">Order Total</td>
                <td style="padding:8px 0 4px;font-weight:800;font-size:21px;color:#C41C1C;text-align:right;white-space:nowrap">$${fmt(hasDiscount ? discountedTotal : totals.totalSell)}</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </div>

    ${notes ? `
    <!-- Notes -->
    <div style="background:#fff;padding:15px 28px;border-top:1px solid #e5e7eb;page-break-inside:avoid">
      <div style="font-size:12px;font-weight:700;color:#C41C1C;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Notes</div>

      <span style="color:#666;font-size:11px">SRF Screen Printing &amp; Apparel Decorating · Estimate valid for 30 days</span>
    </div>
  </div>`;
}

// ── Internal PDF Builder ──────────────────────────────────────────────────────
function buildInternalPdfHtml(items, calcs, totals, clientName, estimateNumber, estimateDate, notes,
  discountAmount, discountedTotal, discountType, discountValue, marginPct, multiplier, effectiveMargin) {

  const decLabels = { screen_transfer: 'Screen Printed Transfer', ucm: 'UCM Transfer', patch: 'Heat-Applied Patch' };
  const safeClientName     = escapeHtml(clientName);
  const safeEstimateNumber = escapeHtml(estimateNumber);
  const safeEstimateDate   = escapeHtml(estimateDate);
  const safeNotes          = escapeHtml(notes).replace(/\n/g, '<br>');
  const safeDiscountValue  = fmt(percentNum(discountValue), 0);
  const hasDiscount        = discountAmount > 0;
  const finalTotal         = hasDiscount ? discountedTotal : totals.totalSell;
  const totalProfit        = finalTotal - totals.totalCost;
  const marginNum          = marginNumFrom(marginPct);

  const pc = v => v >= 0 ? '#16a34a' : '#ef4444';

  const rows = items.map((item, i) => {
    const c          = calcs[i];

    const gtLabel    = escapeHtml((GARMENT_TYPES.find(g => g.value === item.garmentType) || {}).label || 'T-Shirt');
    const itemProfit = c.totalSell - c.totalCost;
    const itemMgn    = c.totalSell > 0 ? (itemProfit / c.totalSell * 100) : 0;

    const cr = (label, cu, su, rowQty) => {
      const q = rowQty !== undefined ? rowQty : qty;
      const tc = cu * q, ts = su * q, tp = ts - tc;

        <td style="padding:5px 8px 5px 18px;font-size:11px;color:#374151">${label}</td>

    // Garment rows — per size tier for internal PDF

    if (c.sizeSells && c.sizeSells.length > 0) {

      ).join('');
    } else {
      garmentRows = cr('Garments (S&amp;S Activewear)', c.gPrice, c.gPrice * c.margin);
    }

    const fp = item.frontPlacements || [];
    const bp = item.backPlacements  || [];
    const placeRow = (fp.length || bp.length) ? `
      <tr style="background:#fafafa;border-bottom:3px solid #e5e7eb">
        <td colspan="6" style="padding:6px 10px 10px">
          <div style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px">Design Placement</div>
          <table style="border-collapse:collapse"><tr>
            ${fp.length ? `<td style="padding:0 10px 0 0;vertical-align:top;text-align:center">${buildGarmentSvgStr(item.garmentType||'tee','front',fp,80)}<div style="font-size:10px;color:#555;margin-top:3px;font-weight:600">Front${fp.length>1?' ('+fp.length+')':''}</div></td>` : ''}
            ${bp.length ? `<td style="padding:0;vertical-align:top;text-align:center">${buildGarmentSvgStr(item.garmentType||'tee','back',bp,80)}<div style="font-size:10px;color:#555;margin-top:3px;font-weight:600">Back${bp.length>1?' ('+bp.length+')':''}</div></td>` : ''}
          </tr></table>
        </td>
      </tr>` : '';

    return `
      <tr style="background:#1A1A1A">
        <td colspan="6" style="padding:8px 10px;border-top:4px solid #C41C1C">

      ${garmentRows}
      ${cr('Decoration incl. flat shipping', c.decCostPerUnit, c.decCostPerUnit * c.margin)}
      ${c.shipPerUnit > 0.001 ? cr('S&amp;S Supplier Shipping', c.shipPerUnit, c.shipPerUnit * c.margin) : ''}
      <tr style="background:#f3f4f6;border-top:2px solid #e5e7eb">
        <td style="padding:7px 8px;font-size:12px;font-weight:800;color:#1A1A1A">TOTAL</td>
        <td style="padding:7px 8px;text-align:right;font-size:12px;font-weight:700;color:#374151">$${fmt(c.totalCostPerUnit)}</td>
        <td style="padding:7px 8px;text-align:right;font-size:12px;font-weight:700;color:#374151">$${fmt(c.totalCost)}</td>

        <td style="padding:7px 8px;text-align:right;font-size:13px;font-weight:800;color:${pc(itemProfit)}">$${fmt(itemProfit)}</td>

        <td colspan="6" style="padding:2px 8px 6px;font-size:10px;color:#9ca3af">
          Item margin: ${fmt(itemMgn,1)}% &middot; Multiplier &times;${fmt(c.margin,3)}
        </td>
      </tr>
      ${placeRow}`;
  }).join('');

  const discountLabel = discountType === 'percent'
    ? `Discount (${safeDiscountValue}% off)` : 'Discount';

  const marginColor = displayMargin < 30 ? '#ef4444' : displayMargin < 40 ? '#f97316' : '#16a34a';

  return `

    <table style="width:100%;border-collapse:collapse;background:#1A1A1A">
      <tr>
        <td style="padding:20px 28px;vertical-align:middle;width:50%">
          <table style="border-collapse:collapse;background:#fff"><tr>
            <td style="padding:6px 10px;vertical-align:middle">
              <img src="data:image/png;base64,${LOGO_B64}" style="height:54px;max-width:170px;display:block" alt="SRF Logo" />
            </td>

        </td>
        <td style="padding:20px 28px;vertical-align:middle;text-align:right;width:50%">
          <div style="color:#ef4444;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:#3a1010;padding:3px 10px;display:inline-block">INTERNAL USE ONLY</div>
          <div style="color:#fff;font-size:22px;font-weight:800;margin-top:4px">WORK ORDER RECORD</div>
          ${estimateNumber ? `<div style="color:#aaa;font-size:12px">Estimate No. ${safeEstimateNumber}</div>` : ''}
          <div style="color:#aaa;font-size:12px">${safeEstimateDate}</div>
        </td>
      </tr>
    </table>

    <table style="width:100%;border-collapse:collapse;background:#C41C1C">
      <tr>
        <td style="padding:10px 28px;vertical-align:middle">
          <span style="color:#fff;font-size:14px;font-weight:700">${clientName ? `Client: ${safeClientName}` : 'SRF Screen Printing &amp; Apparel'}</span>

    </table>

    <div style="background:#fff;padding:0 0 8px">
      <table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed">
        <colgroup>
          <col style="width:28%" /><col style="width:13%" /><col style="width:13%" />
          <col style="width:13%" /><col style="width:16%" /><col style="width:17%" />
        </colgroup>
        <thead>
          <tr style="background:#374151;color:#fff">
            <th style="padding:9px 10px;text-align:left;font-size:11px;font-weight:700">Component</th>
            <th style="padding:9px 8px;text-align:right;font-size:11px;font-weight:700">Cost/Unit</th>
            <th style="padding:9px 8px;text-align:right;font-size:11px;font-weight:700">Total Cost</th>
            <th style="padding:9px 8px;text-align:right;font-size:11px;font-weight:700">Sell/Unit</th>
            <th style="padding:9px 8px;text-align:right;font-size:11px;font-weight:700">Revenue</th>

    <div style="background:#f9f9f9;padding:16px 28px;border-top:2px solid #C41C1C">
      <div style="font-size:12px;font-weight:700;color:#C41C1C;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">Order Totals</div>
      <table style="width:100%;border-collapse:collapse">
        <tr>
          <td style="vertical-align:top;padding:0 16px 0 0;width:33%">
            <div style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;margin-bottom:5px">Cost</div>
            <table style="width:100%;border-collapse:collapse">
              <tr><td style="padding:4px 0;font-size:13px;color:#555;border-bottom:1px solid #e5e7eb">All items</td><td style="padding:4px 0;font-size:13px;font-weight:600;text-align:right;border-bottom:1px solid #e5e7eb">$${fmt(totals.totalCost)}</td></tr>
              <tr><td style="padding:4px 0;font-size:13px;color:#555;border-bottom:1px solid #e5e7eb">S&amp;S Shipping</td><td style="padding:4px 0;font-size:13px;font-weight:600;text-align:right;border-bottom:1px solid #e5e7eb">${totals.supplierShipping === 0 ? '<span style="color:#16a34a">FREE</span>' : `$${fmt(totals.supplierShipping)}`}</td></tr>
              <tr><td style="padding:6px 0;font-size:14px;font-weight:700">Total Cost</td><td style="padding:6px 0;font-size:14px;font-weight:800;text-align:right">$${fmt(totals.totalCost)}</td></tr>
