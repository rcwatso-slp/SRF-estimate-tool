// ── Summary Panel ─────────────────────────────────────────────────────────────
function SummaryPanel({ totals, items, calcs, isFreeShipping, clientName, estimateNumber, estimateDate, notes,
  discountType, discountValue, setDiscountType, setDiscountValue, discountAmount, discountedTotal, effectiveMargin,
  marginPct, setMarginPct, multiplier,
  onSave, onNew, onLoadOpen, saving, savedId }) {
  // Renders an HTML string to PDF via a real DOM element with explicit width.
  // Passing a raw string to html2pdf creates a zero-width container, causing
  // html2canvas to capture blank output.
  const renderHtmlToPdf = (html, fileName) => {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;left:-9999px;top:0;width:780px;background:#fff;z-index:-1;';
    el.innerHTML = html;
    document.body.appendChild(el);
    html2pdf().set({
      margin: [8, 8, 8, 8],
      filename: fileName,
      image: { type: 'jpeg', quality: 0.97 },
      html2canvas: { scale: 2, useCORS: true, allowTaint: true, logging: false, width: 780 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    }).from(el).save()
      .catch(err => alert('PDF error: ' + err.message))
      .finally(() => { if (el.parentNode) el.parentNode.removeChild(el); });
  };

  const exportPdf = () => {
    try {
      const html = buildPdfHtml(items, calcs, totals, clientName, estimateNumber, estimateDate, notes,
        discountAmount, discountedTotal, discountType, discountValue);
      const fileName = [
        'SRF-Estimate',
        estimateNumber ? `No${safeFilePart(estimateNumber)}` : '',
        clientName ? safeFilePart(clientName) : '',
        safeFilePart(estimateDate),
      ].filter(Boolean).join('_') + '.pdf';
      renderHtmlToPdf(html, fileName);
    } catch(err) {
      alert('PDF error: ' + err.message);
      console.error('exportPdf error:', err);
    }
  };

  const exportInternalPdf = () => {
    try {
      const iHtml = buildInternalPdfHtml(items, calcs, totals, clientName, estimateNumber, estimateDate, notes,
        discountAmount, discountedTotal, discountType, discountValue, marginPct, multiplier, effectiveMargin);
      const iFileName = [
        'SRF-Internal',
        estimateNumber ? `No${safeFilePart(estimateNumber)}` : '',
        clientName ? safeFilePart(clientName) : '',
        safeFilePart(estimateDate),
      ].filter(Boolean).join('_') + '.pdf';
      renderHtmlToPdf(iHtml, iFileName);
    } catch(err) {
      alert('PDF error: ' + err.message);
      console.error('exportInternalPdf error:', err);
    }
  };

  return (
    <div className="bg-white rounded-xl shadow-sm p-5 sticky top-4">
      <div className="section-head mb-3">Order Summary</div>

      <div className="space-y-2 mb-4">
        <div className="result-row">
          <span className="result-label">Total Items (types)</span>
          <span className="result-val">{items.length}</span>
        </div>
        <div className="result-row">
          <span className="result-label">Total Units</span>
          <span className="result-val">{totals.totalQty}</span>
        </div>
        <div className="divider" />
        <div className="result-row">
          <span className="result-label">Garment Subtotal (S&S)</span>
          <span className="result-val">{fmtDollar(totals.garmentSubtotal)}</span>
        </div>
        {isFreeShipping ? (
          <div className="result-row">
            <span className="result-label">Supplier Shipping</span>
            <span className="free-ship">FREE ✓</span>
          </div>
        ) : (
          <div className="result-row">
            <span className="result-label">Supplier Shipping</span>
            <span className="result-val">{fmtDollar(totals.supplierShipping)}</span>
          </div>
        )}
        <div className="divider" />
        <div className="result-row">
          <span className="result-label">Total Cost (internal)</span>
          <span className="result-val">{fmtDollar(totals.totalCost)}</span>
        </div>
        <div className="result-row">
          <span className="result-label">Subtotal</span>
          <span className="sell-price">{fmtDollar(totals.totalSell)}</span>
        </div>

        {/* ── Margin ── */}
        <div className="divider" />
        <div className="section-head mb-2">Target Margin</div>
        <div className="flex items-center gap-2">
          <input type="number" min="1" max="95" step="1" className="num-input" style={{width:80}}
            value={marginPct} onChange={e => setMarginPct(sanitizeNumberInput(e.target.value, { min: 1, max: 95 }))} />
          <span className="text-sm text-gray-500">%</span>
          <span className="ml-auto text-xs font-mono bg-gray-100 px-2 py-1 rounded text-brand-black">
            ×{fmt(multiplier, 3)}
          </span>
        </div>
        <div className="text-xs text-gray-400 mt-1">Default 50% = ×2.000 multiplier</div>

        {/* ── Discount ── */}
        <div className="divider" />
        <div className="section-head mb-2">Discount (optional)</div>
        <div className="flex gap-2 mb-2">
          {['percent','dollar'].map(t => (
            <button key={t} onClick={() => {
              setDiscountType(t);
              setDiscountValue(prev => sanitizeNumberInput(prev, { min: 0, max: t === 'percent' ? 100 : Infinity }));
            }}
              className="flex-1 py-1.5 text-xs font-semibold rounded border transition-colors"
              style={{ background: discountType===t ? '#C41C1C' : '#fff', color: discountType===t ? '#fff' : '#374151', borderColor: discountType===t ? '#C41C1C' : '#d1d5db' }}>
              {t === 'percent' ? '% Off' : '$ Off'}
            </button>
          ))}
        </div>
        <input type="number" min="0" max={discountType==='percent' ? '100' : undefined} step={discountType==='percent' ? '1' : '0.01'}
          className="num-input"
          placeholder={discountType==='percent' ? 'e.g. 10  →  10% off' : 'e.g. 25.00  →  $25 off'}
          value={discountValue}
          onChange={e => setDiscountValue(sanitizeNumberInput(e.target.value, { min: 0, max: discountType === 'percent' ? 100 : Infinity }))}
        />
        {discountAmount > 0 && (
          <>
            <div className="result-row mt-2">
              <span className="result-label" style={{color:'#16a34a'}}>Discount</span>
              <span className="result-val" style={{color:'#16a34a'}}>-{fmtDollar(discountAmount)}</span>
            </div>
            <div className="divider" />
            <div className="result-row">
              <span className="result-label font-bold">Client Total</span>
              <span className="sell-price">{fmtDollar(discountedTotal)}</span>
            </div>
            <div className="result-row">
              <span className="result-label">Effective Margin</span>
              <span className="result-val" style={{color: effectiveMargin < 30 ? '#ef4444' : effectiveMargin < 40 ? '#f97316' : '#16a34a'}}>
                {fmt(effectiveMargin, 1)}%
              </span>
            </div>
          </>
        )}
        {discountAmount === 0 && (
          <div className="result-row mt-1">
            <span className="result-label">Overall Margin</span>
            <span className="result-val" style={{color: marginNumFrom(marginPct) < 30 ? '#ef4444' : marginNumFrom(marginPct) < 40 ? '#f97316' : '#16a34a'}}>
              {fmt(marginNumFrom(marginPct), 1)}%
            </span>
          </div>
        )}
      </div>

      {/* ── Save / Load / New ── */}
      <div className="divider mb-3" />
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6, marginBottom: 6 }}>
        <button onClick={onSave} disabled={saving}
          style={{ background: saving ? '#9ca3af' : '#1A1A1A', color: '#fff', border: 'none', borderRadius: 7, padding: '9px 0', fontWeight: 700, fontSize: 12, cursor: saving ? 'default' : 'pointer', textTransform: 'uppercase', letterSpacing: '.04em' }}>
          {saving ? 'Saving…' : savedId ? '✓ Save' : '💾 Save'}
        </button>
        <button onClick={onLoadOpen}
          style={{ background: '#fff', color: '#1A1A1A', border: '1.5px solid #1A1A1A', borderRadius: 7, padding: '9px 0', fontWeight: 700, fontSize: 12, cursor: 'pointer', textTransform: 'uppercase', letterSpacing: '.04em' }}>
          📂 Load
        </button>
      </div>
      <button onClick={onNew}
        style={{ width: '100%', background: 'none', color: '#6b7280', border: '1px dashed #d1d5db', borderRadius: 7, padding: '7px 0', fontWeight: 600, fontSize: 12, cursor: 'pointer', marginBottom: 10 }}>
        + New Estimate
      </button>
      {savedId && <div style={{ textAlign: 'center', fontSize: 11, color: '#16a34a', marginBottom: 8 }}>Auto-saved · ID {savedId.slice(0, 8)}…</div>}

      <button
        onClick={exportPdf}
        className="w-full py-3 px-4 rounded-lg text-white font-bold text-sm uppercase tracking-wide transition-colors"
        style={{ background: '#C41C1C' }}
        onMouseOver={e => e.currentTarget.style.background = '#a31717'}
        onMouseOut={e => e.currentTarget.style.background = '#C41C1C'}
      >
        Export Client Estimate
      </button>

      <button
        onClick={exportInternalPdf}
        className="w-full mt-2 py-2.5 px-4 rounded-lg font-bold text-sm uppercase tracking-wide transition-colors"
        style={{ background: '#1A1A1A', color: '#fff' }}
        onMouseOver={e => e.currentTarget.style.background = '#333'}
        onMouseOut={e => e.currentTarget.style.background = '#1A1A1A'}
      >
        Export Internal Record
      </button>

      <p className="text-xs text-gray-400 mt-2 text-center">Client PDF hides cost &amp; margin &middot; Internal includes all data</p>
    </div>
  );
}

// ── Estimates List Modal ─────────────────────────────────────────────────────
function EstimatesList({ onLoad, onClose }) {
  const [estimates, setEstimates] = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [deleting, setDeleting]   = React.useState(null);

  React.useEffect(() => {
    _supabase.from('estimates')
      .select('id, client_name, estimate_number, estimate_date, total_sell, updated_at')
      .order('updated_at', { ascending: false })
      .limit(100)
      .then(({ data }) => { setEstimates(data || []); setLoading(false); });
  }, []);

  React.useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [onClose]);

  const loadFull = async (id) => {
    const { data } = await _supabase.from('estimates').select('*').eq('id', id).single();
    if (data) onLoad(data);
  };

  const deleteEst = async (e, id) => {
    e.stopPropagation();
    if (!window.confirm('Delete this estimate? This cannot be undone.')) return;
    setDeleting(id);
    await _supabase.from('estimates').delete().eq('id', id);
    setEstimates(prev => prev.filter(x => x.id !== id));
    setDeleting(null);
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)', zIndex: 2000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background: '#fff', borderRadius: 12, width: '100%', maxWidth: 580, maxHeight: '80vh', display: 'flex', flexDirection: 'column', boxShadow: '0 8px 40px rgba(0,0,0,0.2)' }}>
        <div style={{ padding: '16px 20px', borderBottom: '1px solid #e5e7eb', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ fontWeight: 800, fontSize: 16 }}>Saved Estimates</div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#9ca3af', fontSize: 22 }}>×</button>
        </div>
        <div style={{ overflowY: 'auto', flex: 1 }}>
          {loading && <div style={{ padding: 24, textAlign: 'center', color: '#6b7280', fontSize: 13 }}>Loading…</div>}
          {!loading && estimates.length === 0 && <div style={{ padding: 24, textAlign: 'center', color: '#9ca3af', fontSize: 13 }}>No saved estimates yet.</div>}
          {estimates.map(est => (
            <div key={est.id} onClick={() => loadFull(est.id)}
              style={{ padding: '13px 20px', borderBottom: '1px solid #f0f0f0', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10 }}
              onMouseOver={e => e.currentTarget.style.background = '#f9fafb'}
              onMouseOut={e => e.currentTarget.style.background = '#fff'}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 14, color: '#1A1A1A' }}>
                  {est.client_name || '(No client)'}{est.estimate_number ? ` — #${est.estimate_number}` : ''}
                </div>
                <div style={{ fontSize: 12, color: '#6b7280', marginTop: 2 }}>
                  {est.estimate_date} &middot; {fmtDollar(est.total_sell || 0)}
                </div>
              </div>
              <button onClick={e => deleteEst(e, est.id)} disabled={deleting === est.id}
                style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#d1d5db', fontSize: 16, padding: '4px 6px', borderRadius: 4 }}
                title="Delete"
                onMouseOver={e => e.currentTarget.style.color = '#ef4444'}
                onMouseOut={e => e.currentTarget.style.color = '#d1d5db'}>
                {deleting === est.id ? '…' : '🗑'}
              </button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [items, setItems]             = useState([createItem()]);
  const [clientName, setClientName]   = useState('');
  const [estimateNumber, setEstNum]   = useState('');
  const [estimateDate, setEstDate]    = useState(new Date().toISOString().slice(0, 10));
  const [notes, setNotes]             = useState('');
  const [supplierShipping, setSupShip]    = useState('');
  const [marginPct, setMarginPct]          = useState('50');
  const [discountType, setDiscountType]   = useState('percent');
  const [discountValue, setDiscountValue] = useState('');

  // derived
  const garmentSubtotal = useMemo(
    () => items.reduce((s, it) => {
      if (it.sizeBreakdown && it.sizeBreakdown.length > 0) {
        const bdCost = it.sizeBreakdown.reduce((ss, r) => ss + (parseFloat(r.price) || 0) * (parseInt(r.qty) || 0), 0);
        if (bdCost > 0) return s + bdCost;
      }
      return s + qtyNum(it.quantity) * moneyNum(it.garmentPrice);
    }, 0),
    [items]
  );
  const isFreeShipping = garmentSubtotal >= 200;
  const totalQty = useMemo(() => items.reduce((s, it) => s + itemQty(it), 0), [items]);
  const supplierShippingNum = isFreeShipping ? 0 : moneyNum(supplierShipping);

  const marginNum  = marginNumFrom(marginPct);
  const multiplier = 1 / (1 - marginNum / 100);

  const calcs = useMemo(
    () => items.map(it => calcItem(it, isFreeShipping, supplierShippingNum, totalQty, multiplier)),
    [items, isFreeShipping, supplierShippingNum, totalQty, multiplier]
  );

  const totals = useMemo(() => ({
    totalQty,
    garmentSubtotal,
    supplierShipping: supplierShippingNum,
    totalCost: calcs.reduce((s, c) => s + c.totalCost, 0),
    totalSell: calcs.reduce((s, c) => s + c.totalSell, 0),
  }), [calcs, totalQty, garmentSubtotal, supplierShippingNum]);

  const discountNum = discountType === 'percent'
    ? percentNum(discountValue)
    : moneyNum(discountValue);
  const discountAmount = useMemo(() => {
    if (!discountNum) return 0;
    const rawDiscount = discountType === 'percent'
      ? totals.totalSell * (discountNum / 100)
      : discountNum;
    return Math.min(rawDiscount, totals.totalSell);
  }, [discountType, discountNum, totals.totalSell]);
  const discountedTotal = Math.max(0, totals.totalSell - discountAmount);
  const effectiveMargin = discountedTotal > 0 && totals.totalCost > 0
    ? ((discountedTotal - totals.totalCost) / discountedTotal) * 100
    : marginNum;

  // ── Auth + persistence ──────────────────────────────────────────────────────
  const [session, setSession]       = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [savedId, setSavedId]       = useState(null);
  const [saving, setSaving]         = useState(false);
  const [loadOpen, setLoadOpen]     = useState(false);

  React.useEffect(() => {
    _supabase.auth.getSession().then(({ data: { session: s } }) => { setSession(s); setAuthChecked(true); });
    const { data: { subscription } } = _supabase.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => subscription.unsubscribe();
  }, []);

  const saveEstimate = async () => {
    setSaving(true);
    const payload = {
      estimate_number: estimateNumber, client_name: clientName, estimate_date: estimateDate,
      notes, items, discount_type: discountType, discount_value: discountValue,
      margin_pct: marginPct, total_cost: totals.totalCost, total_sell: totals.totalSell,
      updated_at: new Date().toISOString(),
    };
    const { data } = savedId
      ? await _supabase.from('estimates').update(payload).eq('id', savedId).select().single()
      : await _supabase.from('estimates').insert(payload).select().single();
    if (data) setSavedId(data.id);
    setSaving(false);
  };

  const newEstimate = () => {
    if (!window.confirm('Start a new estimate? Unsaved changes will be lost.')) return;
    setItems([createItem()]); setClientName(''); setEstNum('');
    setEstDate(new Date().toISOString().slice(0, 10)); setNotes('');
    setSupShip(''); setMarginPct('50'); setDiscountType('percent');
    setDiscountValue(''); setSavedId(null);
  };

  const loadEstimate = (est) => {
    setItems(est.items && est.items.length ? est.items : [createItem()]);
    setClientName(est.client_name || ''); setEstNum(est.estimate_number || '');
    setEstDate(est.estimate_date || new Date().toISOString().slice(0, 10));
    setNotes(est.notes || ''); setDiscountType(est.discount_type || 'percent');
    setDiscountValue(est.discount_value || ''); setMarginPct(est.margin_pct || '50');
    setSavedId(est.id); setLoadOpen(false);
  };

  const handleChange = useCallback((id, field, value) => {
    setItems(prev => prev.map(it => it.id === id ? { ...it, [field]: value } : it));
  }, []);

  const addItem = () => setItems(prev => [...prev, createItem()]);
  const removeItem = (id) => setItems(prev => prev.filter(it => it.id !== id));

  // threshold progress
  const progress = Math.min(garmentSubtotal / 200, 1);
  const remaining = Math.max(200 - garmentSubtotal, 0);

  // Auth gate
  if (!authChecked) return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#6b7280', fontSize: 15 }}>Loading…</div>
  );
  if (!session) return <LoginScreen />;

  return (
    <div className="min-h-screen" style={{ background: '#f0f0f0' }}>
      {loadOpen && <EstimatesList onLoad={loadEstimate} onClose={() => setLoadOpen(false)} />}
      {/* Header */}
      <header style={{ background: '#1A1A1A' }} className="shadow-md">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-4">
            <img src={`data:image/png;base64,${LOGO_B64}`}
              alt="SRF Logo" className="h-12 object-contain" />
            <div>
              <div className="text-white font-bold text-lg leading-tight">Estimate Tool</div>
              <div className="text-gray-400 text-xs">Screen Printing &amp; Apparel Decorating</div>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <div className="text-gray-400 text-xs text-right hidden sm:block">
              {session?.user?.email}
            </div>
            <button onClick={() => _supabase.auth.signOut()}
              style={{ fontSize: 12, color: '#9ca3af', background: 'none', border: '1px solid #444', borderRadius: 5, padding: '4px 10px', cursor: 'pointer' }}>
              Sign Out
            </button>
          </div>
        </div>
      </header>

      <div className="max-w-7xl mx-auto px-4 py-6">
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

          {/* ── Left column: main form ── */}
          <div className="lg:col-span-2">

            {/* Estimate meta */}
            <div className="bg-white rounded-xl shadow-sm p-5 mb-4">
              <div className="section-head mb-3">Estimate Details</div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <div className="label">Client Name</div>
                  <input className="num-input" placeholder="Client or company name"
                    value={clientName} onChange={e => setClientName(e.target.value)} />
                </div>
                <div>
                  <div className="label">Estimate #</div>
                  <input className="num-input" placeholder="e.g. 001"
                    value={estimateNumber} onChange={e => setEstNum(e.target.value)} />
                </div>
                <div>
                  <div className="label">Date</div>
                  <input type="date" className="num-input"
                    value={estimateDate} onChange={e => setEstDate(e.target.value)} />
                </div>
              </div>
            </div>

            {/* Shipping threshold card */}
            <div className={`rounded-xl shadow-sm p-4 mb-4 border-2 ${isFreeShipping ? 'border-green-400 bg-green-50' : 'border-orange-200 bg-orange-50'}`}>
              <div className="flex items-center justify-between mb-2">
                <div className="font-semibold text-sm">
                  S&amp;S Activewear Shipping Threshold
                </div>
                {isFreeShipping
                  ? <span className="free-ship text-sm">✓ FREE SHIPPING</span>
                  : <span className="warn-ship text-sm">${fmt(remaining, 2)} away from free shipping</span>
                }
              </div>
              {/* progress bar */}
              <div className="h-2 bg-gray-200 rounded-full overflow-hidden mb-2">
                <div
                  className="h-2 rounded-full transition-all duration-300"
                  style={{ width: `${progress * 100}%`, background: isFreeShipping ? '#16a34a' : '#C41C1C' }}
                />
              </div>
              <div className="flex justify-between text-xs text-gray-500 mb-2">
                <span>Garment subtotal: <strong>{fmtDollar(garmentSubtotal)}</strong></span>
                <span>Threshold: <strong>$200.00</strong></span>
              </div>

              {!isFreeShipping && (
                <div className="mt-2">
                  <div className="label">Estimated Supplier Shipping ($)</div>
                  <input type="number" min="0" step="0.01" className="num-input"
                    style={{ maxWidth: 180 }}
                    placeholder="0.00"
                    value={supplierShipping}
                    onChange={e => setSupShip(sanitizeNumberInput(e.target.value, { min: 0 }))} />
                  <div className="text-xs text-gray-400 mt-1">
                    Will be split proportionally across items by quantity
                  </div>
                </div>
              )}
            </div>

            {/* Item cards */}
            {items.map((item, i) => (
              <ItemCard
                key={item.id}
                item={item}
                index={i}
                calc={calcs[i]}
                isFreeShipping={isFreeShipping}
                onChange={handleChange}
                onRemove={removeItem}
                canRemove={items.length > 1}
              />
            ))}

            <button
              onClick={addItem}
              className="w-full py-3 px-4 rounded-xl border-2 border-dashed font-semibold text-sm transition-colors"
              style={{ borderColor: '#C41C1C', color: '#C41C1C' }}
              onMouseOver={e => { e.currentTarget.style.background = '#fff0f0'; }}
              onMouseOut={e => { e.currentTarget.style.background = 'transparent'; }}
            >
              + Add Another Item
            </button>

            {/* Notes */}
            <div className="bg-white rounded-xl shadow-sm p-5 mt-4">
              <div className="label">Notes (optional — appears on PDF)</div>
              <textarea
                className="num-input mt-1"
                rows={3}
                placeholder="e.g. Rush order, special instructions, artwork notes..."
                value={notes}
                onChange={e => setNotes(e.target.value)}
              />
            </div>
          </div>

          {/* ── Right column: summary ── */}
          <div className="lg:col-span-1">
            <SummaryPanel
              totals={totals}
              items={items}
              calcs={calcs}
              isFreeShipping={isFreeShipping}
              clientName={clientName}
              estimateNumber={estimateNumber}
              estimateDate={estimateDate}
              notes={notes}
              discountType={discountType}
              discountValue={discountValue}
              setDiscountType={setDiscountType}
              setDiscountValue={setDiscountValue}
              discountAmount={discountAmount}
              discountedTotal={discountedTotal}
              effectiveMargin={effectiveMargin}
              marginPct={marginPct}
              setMarginPct={setMarginPct}
              multiplier={multiplier}
              onSave={saveEstimate}
              onNew={newEstimate}
              onLoadOpen={() => setLoadOpen(true)}
              saving={saving}
              savedId={savedId}
            />

            {/* Per-item breakdown */}
            <div className="bg-white rounded-xl shadow-sm p-5 mt-4">
              <div className="section-head mb-3">Line Breakdown</div>
              {items.map((item, i) => {
                const c = calcs[i];
                const name = item.name || `Item ${i + 1}`;
                return (
                  <div key={item.id} className="mb-3 pb-3 border-b border-gray-100 last:border-0 last:mb-0 last:pb-0">
                    <div className="font-semibold text-sm text-brand-black mb-1">{name}</div>
                    <div className="text-xs space-y-1 text-gray-500">
                      <div className="flex justify-between">
                        <span>Qty × Sell Price</span>
                        <span>{qtyNum(item.quantity)} × {fmtDollar(c.sellPerUnit)}</span>
                      </div>
                      <div className="flex justify-between font-semibold text-brand-red">
                        <span>Line Total</span>
                        <span>{fmtDollar(c.totalSell)}</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
