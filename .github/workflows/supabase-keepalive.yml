name: Supabase Keepalive

# Runs every 3 days to prevent the free-tier project from pausing
# (Supabase pauses projects after 7 days of inactivity)
on:
  schedule:
    - cron: '0 12 */3 * *'   # noon UTC, every 3rd day
  workflow_dispatch:           # allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/estimates?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $response"
          if [ "$response" != "200" ] && [ "$response" != "401" ] && [ "$response" != "406" ]; then
            echo "Unexpected response code — project may be paused or unreachable"
            exit 1
          fi
          echo "Keepalive successful"
